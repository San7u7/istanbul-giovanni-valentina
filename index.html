<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Il viaggio a Istanbul di Giovanni e Valentina, 15–21 marzo 2027.">
<title>Istanbul in due</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: un viaggio a pagine, una schermata alla volta come le storie di un telefono.
   Poster pop delle piastrelle di Iznik; grammatica Appress OS DS v1.1 (flusso, hairline,
   superfici solo dove servono, progressive disclosure). Mobile first, iPhone. */
:root{
  --paper:#fff3dc;--ink:#16123a;--iznik:#2338d6;--tulip:#ff4a2f;
  --saffron:#ffc626;--pistachio:#8fdc8a;--rose:#ff9fd0;--white:#ffffff;--ok:#1f7a3a;--warn:#8a1f12;
  --display:"Bagel Fat One","Arial Black",Impact,sans-serif;
  --body:"Figtree","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-control:8px;--r-soft:14px;--r-organic:22px;--r-full:999px;
  --pop:5px 5px 0 var(--ink);
  --hair:rgba(22,18,58,.16);--hair-dark:rgba(255,243,220,.22);
  --gut-l:max(18px,env(safe-area-inset-left,0px));--gut-r:max(18px,env(safe-area-inset-right,0px));
  --bar-h:56px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--ink);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;touch-action:manipulation}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}
.ttl:focus{outline:none}
:focus-visible{outline:3px solid var(--tulip);outline-offset:3px;border-radius:var(--r-control)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.soft{opacity:.78;font-size:15px}
.num{font-variant-numeric:tabular-nums}

/* ---------- BARRA ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--ink);color:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-left:var(--gut-l);padding-right:var(--gut-r)}
.bar[hidden]{display:none}
.bar .in{height:var(--bar-h);display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:var(--s3);max-width:760px;margin:0 auto}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--paper);background:transparent;color:var(--paper);display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:800}
.bar .lab{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .cnt{font-family:var(--mono);font-size:12px;font-weight:700}
.bar .prog{height:4px;background:rgba(255,243,220,.18);margin:0 calc(var(--gut-r) * -1) 0 calc(var(--gut-l) * -1)}
.bar .prog i{display:block;height:100%;width:0;background:var(--saffron);transition:width .45s cubic-bezier(.2,1.2,.4,1)}

/* ---------- PAGINE ---------- */
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 28px);padding-bottom:max(28px,env(safe-area-inset-bottom,0px))}
.page[hidden]{display:none!important}
.page .col{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5);flex:1}
.page.center .col{justify-content:center}
.foot{margin-top:auto;padding-top:var(--s5);display:flex;flex-direction:column;gap:var(--s3);align-items:stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:56px;padding:0 var(--s6);border:3px solid var(--ink);border-radius:var(--r-full);background:var(--saffron);color:var(--ink);font-family:var(--display);font-size:24px;cursor:pointer;box-shadow:var(--pop);transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.quiet{background:transparent;box-shadow:none;font-family:var(--body);font-weight:800;font-size:16px;min-height:48px;padding:0 var(--s5);border-width:2px}
.btn.wide{width:100%}
.t-blue{background:var(--iznik);color:var(--paper)}
.t-rose{background:var(--rose)}
.t-green{background:var(--pistachio)}
.t-saffron{background:var(--saffron)}
.t-paper{background:var(--paper)}
.t-ink{background:var(--ink);color:var(--paper)}
.t-ink .btn.quiet{color:var(--paper);border-color:var(--paper)}
.mid{font-size:clamp(34px,9vw,64px)}
.lede{font-size:clamp(18px,4.6vw,21px);max-width:38ch}

/* splash centrata */
.splash{background:var(--iznik);color:var(--paper);position:relative;overflow:hidden;padding-top:max(28px,env(safe-area-inset-top,0px))}
.splash .tiles{position:absolute;inset:0;width:100%;height:100%;opacity:.17;pointer-events:none}
.splash .col{position:relative;justify-content:center;align-items:center;text-align:center;gap:var(--s5)}
.splash h1{font-size:clamp(64px,20vw,200px);line-height:.85;display:flex;flex-wrap:nowrap;justify-content:center}
.splash .col{max-width:1200px}
.splash h1 .ch{display:inline-block}
.splash h1 .ch:nth-child(odd){color:var(--saffron)}.splash h1 .ch:nth-child(even){color:var(--rose)}
.splash .who{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.14em}
.splash .when{font-family:var(--display);font-size:clamp(20px,5.4vw,30px)}
.bye{font-size:clamp(54px,14vw,120px);color:var(--saffron);line-height:.9}
.thanks .col{gap:var(--s4)}
.enter{font-size:30px;min-height:72px;width:100%;max-width:380px;margin-top:var(--s4)}
.wobble{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.03)}}

/* benvenuto */
.names{font-family:var(--display);font-size:clamp(40px,11vw,80px);line-height:.95}
.names em{font-style:normal;color:var(--tulip)}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 56px;overflow:hidden;background:var(--white);border:3px solid var(--ink);border-radius:var(--r-organic);box-shadow:var(--pop)}
.ticket .legs{padding:var(--s3) var(--s4)}
.leg{display:grid;grid-template-columns:auto minmax(24px,1fr) auto;align-items:center;gap:var(--s3);padding-block:var(--s3)}
.leg+.leg{border-top:2px dashed var(--hair)}
.leg .city{font-family:var(--display);font-size:clamp(30px,8vw,46px);line-height:1}
.leg .city small{display:block;font-family:var(--mono);font-size:11px;font-weight:700;margin-top:4px}
.leg .city.r{text-align:right}
.leg .md{text-align:center;font-family:var(--mono);font-size:11px;font-weight:700}
.leg .md i{display:block;height:3px;margin:6px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px)}
.ticket .stub{background:var(--tulip);color:var(--ink);border-left:3px dashed var(--ink);display:grid;place-items:center;writing-mode:vertical-rl;font-family:var(--mono);font-weight:700;letter-spacing:.16em;font-size:11px}
.facts{display:flex;flex-wrap:wrap;gap:var(--s2) 0;font-family:var(--display);font-size:clamp(18px,4.8vw,24px)}
.facts span{display:inline-flex;align-items:center}
.facts span+span::before{content:"";width:10px;height:10px;background:var(--tulip);transform:rotate(45deg);margin:0 var(--s3)}

/* copertina */
.cover .num-big{font-family:var(--display);font-size:clamp(120px,40vw,240px);line-height:.8}
.cover h2{font-size:clamp(54px,15vw,110px)}
.cover .w,.qwrap .w{display:inline-block}

/* domanda */
.qwrap{display:flex;flex-direction:column;gap:var(--s4)}
.qwrap h2{font-size:clamp(36px,10vw,62px)}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3)}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:84px;padding:var(--s4) var(--s5);border:3px solid var(--ink);border-radius:var(--r-organic);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .12s,background .2s}
.opt b{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,28px);line-height:1.05}
.opt span{font-size:15px;opacity:.82}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:var(--pop)}
.opt:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{min-height:52px;padding:0 var(--s5);border:3px solid var(--ink);border-radius:var(--r-full);background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* hotel */
.duel-note{font-weight:700;background:var(--white);border:3px solid var(--ink);border-radius:var(--r-soft);padding:var(--s3) var(--s4)}
.verdict{font-family:var(--display);font-size:clamp(64px,18vw,140px);line-height:.85}
.why p{display:grid;grid-template-columns:26px minmax(0,1fr);gap:var(--s2);padding-block:var(--s2)}
.why p+p{border-top:2px solid var(--hair)}
.why p::before{content:"✓";font-family:var(--display);color:var(--ok);font-size:22px;line-height:1.1}
.why p.minus::before{content:"!";color:var(--warn)}
.hotel{overflow:hidden;background:var(--white);border:3px solid var(--ink);border-radius:var(--r-organic);box-shadow:var(--pop)}
.galwrap{position:relative;border-bottom:3px solid var(--ink)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:20px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.gnav.prev{left:var(--s3)}.gnav.next{right:var(--s3)}
.gnav:active{transform:translateY(-50%) scale(.92)}
.dots{position:absolute;bottom:var(--s3);left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(22,18,58,.6);padding:6px 8px;border-radius:var(--r-full)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--paper);opacity:.5}
.dots i.on{opacity:1;background:var(--saffron)}
.hotel .body{padding:var(--s4) var(--s5) var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.hotel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.hotel .where{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;margin-top:6px}
.score{font-family:var(--display);font-size:24px;background:var(--ink);color:var(--paper);border-radius:var(--r-soft);padding:4px 12px;line-height:1.1;white-space:nowrap}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:var(--r-full);padding:3px;background:var(--paper);align-self:flex-start}
.seg button{border:0;background:transparent;font-weight:700;font-size:15px;padding:0 16px;min-height:42px;border-radius:var(--r-full);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.offer{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.offer .price{font-family:var(--display);font-size:clamp(40px,11vw,54px);line-height:1}
.offer .spec{font-weight:700}
.paid{font-size:14px;font-weight:700;background:var(--saffron);border-radius:var(--r-control);padding:var(--s2) var(--s3)}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s5)}
details.more{border-top:2px solid var(--hair);padding-top:var(--s2)}
details.more>summary{cursor:pointer;list-style:none;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:48px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-family:var(--display);font-size:26px;line-height:1;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(45deg)}
details.more>.inner{padding-block:var(--s2) var(--s3)}
.t-ink details.more{border-color:var(--hair-dark)}
.srow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s3);align-items:center;padding-block:var(--s2)}
.srow+.srow{border-top:2px solid var(--hair)}
.srow .lab{font-weight:800;font-size:15px}
.bars{display:grid;gap:5px}
.br{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:var(--s2);align-items:center}
.br .tr{height:12px;border-radius:var(--r-full);background:rgba(22,18,58,.08);overflow:hidden}
.br .f{height:100%;border-radius:var(--r-full)}
.br.e .f{background:var(--iznik)}.br.a .f{background:var(--tulip)}
.br .v{font-family:var(--mono);font-weight:700;font-size:13px;text-align:right}
.br .v.win{color:var(--ok)}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-weight:700;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rv{display:grid;grid-template-columns:18px minmax(0,1fr);gap:var(--s2);padding-block:var(--s2);font-size:15px}
.rv+.rv{border-top:2px solid var(--hair)}
.rv::before{content:"";width:14px;height:14px;border-radius:50%;margin-top:4px;border:2px solid var(--ink);background:var(--white)}
.rv.bad::before{background:var(--tulip)}
.rv small{display:block;font-family:var(--mono);font-size:10px;opacity:.65;letter-spacing:.05em}

/* guida */
.days{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding-bottom:var(--s2);scroll-snap-type:x proximity;margin-inline:calc(var(--gut-l) * -1) calc(var(--gut-r) * -1);padding-inline:var(--gut-l) var(--gut-r)}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;scroll-snap-align:start;border:3px solid var(--ink);background:var(--white);border-radius:var(--r-soft);padding:8px 14px;cursor:pointer;text-align:left;font-weight:700;font-size:13px;line-height:1.15;min-height:58px}
.days button b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.days button.sp{background:var(--saffron)}
.days button.sp[aria-pressed="true"]{background:var(--ink)}
.dtitle{font-size:clamp(36px,10vw,56px)}
.fact{border-left:6px solid var(--saffron);padding-left:var(--s3);font-size:15px}
.fact b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em}
.note{font-size:15px;font-weight:600;background:var(--rose);border-radius:var(--r-soft);padding:var(--s3) var(--s4)}
.stop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);padding-block:var(--s3);align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:2px solid var(--hair);cursor:pointer;color:inherit}
.stop:first-child{border-top:0}
.stop.static{cursor:default}
.stop .top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.stop .what{font-weight:800;font-size:17px}
.stop .d{display:block;font-size:15px;opacity:.82;margin-top:4px}
.stop .cost{display:block;font-family:var(--mono);font-size:12px;font-weight:700;margin-top:4px}
.stop .open{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;background:var(--paper);flex:0 0 auto}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-full);padding:3px 9px;border:2px solid var(--ink);white-space:nowrap}
.tag.in{background:var(--iznik);color:var(--paper)}
.tag.out{background:var(--white)}
.tag.free{background:var(--pistachio)}
.tag.gem{background:var(--saffron)}
.tag.go{background:var(--paper);border-style:dashed}
.keys{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.meal{display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--s3);padding-block:var(--s3);align-items:baseline}
.meal+.meal{border-top:2px solid var(--hair)}
.meal b{font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.meal .n{font-family:var(--display);font-size:22px;line-height:1.05;display:block}
.meal .z{display:block;font-family:var(--mono);font-size:11px;font-weight:700;margin-top:2px}
.meal .t{display:block;font-size:15px;margin-top:2px}
.meal .w{display:block;font-size:13px;font-weight:700;margin-top:2px;color:var(--warn)}
.dayblock{padding-block:var(--s4)}
.dayblock+.dayblock{border-top:3px solid var(--ink)}
.dayblock h3{font-size:clamp(24px,6.5vw,32px)}
.lnk{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.lnk a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:2px solid var(--ink);border-radius:var(--r-full);background:var(--white);font-size:13px;font-weight:800;text-decoration:none}
.warnbox{background:var(--white);border:3px solid var(--warn);border-radius:var(--r-organic);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.warnbox .eyebrow{color:var(--warn)}
.tipgroup{padding-block:var(--s4)}
.tipgroup+.tipgroup{border-top:3px solid var(--ink)}
.tiph{display:flex;align-items:center;gap:var(--s3);font-size:clamp(28px,7.5vw,40px);margin-bottom:var(--s2)}
.tipn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--tulip);color:var(--ink);font-size:22px;flex:0 0 auto}
.tip{display:grid;gap:2px;padding-block:var(--s3)}
.tip+.tip{border-top:2px solid var(--hair)}
.tip b{font-weight:800;font-size:17px}
.tip span{font-size:15px;opacity:.85}

/* scheda di approfondimento */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;border-radius:var(--r-organic) var(--r-organic) 0 0;background:var(--paper);color:var(--ink);border-top:3px solid var(--ink);overflow:auto}
dialog.sheet::backdrop{background:rgba(22,18,58,.6)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:var(--r-organic);border:3px solid var(--ink);box-shadow:var(--pop)}}
.sheet .in{padding:var(--s5) var(--gut-r) max(var(--s5),env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:var(--s4)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto}
.sheet h3{font-size:clamp(30px,8vw,44px)}
.sheet .txt p+p{margin-top:var(--s3)}
.sheet .acts{display:grid;gap:var(--s2)}
.sheet .acts .btn{font-size:20px;min-height:52px}
.sheet .x{position:sticky;top:0;align-self:flex-end;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--white);font-size:20px;font-weight:800;cursor:pointer}

/* elenchi tabellari appendice */
.tbl{display:grid}
.tbl .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);padding-block:var(--s3);border-top:2px solid var(--hair)}
.tbl .r:first-child{border-top:0}
.tbl .r b{display:block}
.tbl .r small{display:block;font-size:14px;opacity:.8}
.tbl .r .v{font-family:var(--mono);font-weight:700;white-space:nowrap;text-align:right}
.cheap{background:var(--white);border:3px solid var(--ink);border-radius:var(--r-organic);box-shadow:var(--pop);padding:var(--s5)}
.cheap .big{font-family:var(--display);font-size:clamp(52px,14vw,88px);line-height:.9}
.timeline .r{grid-template-columns:64px minmax(0,1fr)}
.timeline .r .v{text-align:left}

/* riepilogo e lista */
.srec{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--s3);padding-block:var(--s3)}
.srec+.srec{border-top:1px solid var(--hair-dark)}

var INFO={
"Ippodromo e piazza Sultanahmet":"Era il cuore della Costantinopoli bizantina: qui decine di migliaia di persone tifavano le corse delle bighe, e nel 532 da qui partì la rivolta di Nika. Oggi è una piazza allungata con tre monumenti: l'obelisco egizio del faraone Thutmose III, rialzato qui nel 390, la Colonna Serpentina arrivata da Delfi e l'obelisco murato. Da qui si vedono insieme Santa Sofia e la Moschea Blu.",
"Piccola Santa Sofia":"Costruita da Giustiniano tra il 527 e il 536 come chiesa dei santi Sergio e Bacco, poco prima di Santa Sofia: per questo la chiamano la sua «prova generale». Oggi è una moschea, gratuita e quasi sempre tranquilla. Nella medrese accanto si tengono laboratori di pittura su ceramica.",
"Moschea di Sokollu Mehmed Paşa":"Piccola moschea progettata da Sinan nel 1571–72 per il gran visir Sokollu Mehmed Paşa. Le piastrelle di Iznik sono tra le più belle della città, e sopra l'ingresso, nel mihrab e nel minbar sono incastonati frammenti della Pietra Nera della Kaaba. Si trova in salita, a otto minuti dalla Piccola Santa Sofia.",
"Arasta Bazaar":"Una fila di botteghe ai piedi della Moschea Blu, nata per finanziarne la manutenzione con gli affitti. Tessili, ceramiche e tappeti, in un ambiente più calmo del Gran Bazar e aperto anche la domenica. Qui c'è Jennifer's Hamam, con i teli tessuti a mano.",
"Santa Sofia":"Consacrata da Giustiniano nel 537 dopo appena cinque anni di lavori, è stata per quasi mille anni la chiesa più grande del mondo. Moschea dal 1453, museo dal 1934 e di nuovo moschea dal 2020. Gli stranieri entrano dall'ingresso est e visitano la galleria superiore, da cui si vedono i mosaici bizantini e la grande cupola. Sulla balaustra c'è il graffito runico di un vichingo di nome Halfdan.",
"Moschea Blu":"La moschea del sultano Ahmed fu terminata nel 1616 e si chiama «Blu» per le oltre 20.000 piastrelle di Iznik dell'interno. Quando fu costruita era l'unica di Istanbul con sei minareti. È una moschea attiva: si entra gratis fuori dagli orari della preghiera, con spalle e ginocchia coperte e il foulard per le donne.",
"Cisterna Basilica":"Il più grande serbatoio sotterraneo della città, voluto da Giustiniano nel VI secolo per rifornire d'acqua il Gran Palazzo. Ha 336 colonne, molte riprese da edifici più antichi, e due basi scolpite con la testa di Medusa, una capovolta e una girata di lato. Si paga solo con carta.",
"Cisterna di Şerefiye":"Una cisterna più piccola, costruita sotto Teodosio II nel V secolo e riscoperta durante i lavori sotto un edificio comunale. Restaurata e aperta nel 2018, ha un percorso sopraelevato con giochi di luce. È a metà strada tra l'hotel e Sultanahmet, con pochissima coda.",
"Gran Bazar":"Uno dei mercati coperti più antichi e grandi del mondo, nato sotto Mehmet II subito dopo la conquista del 1453. Oggi ha più di 60 vie e circa 4.000 negozi; il nucleo antico è il Cevahir Bedesteni, il magazzino dei gioielli. È chiuso la domenica. Si tratta sempre sul prezzo, tranne nei negozi a prezzo fisso.",
"Cortile del Büyük Valide Han":"Il caravanserraglio più grande della città, costruito nel 1651 per la sultana madre Kösem. Qui dormivano i mercanti con le merci; oggi i cortili ospitano tessitori e piccoli laboratori. I suoi tetti compaiono nell'inseguimento iniziale di Skyfall. Il tetto non è sempre accessibile, il cortile sì.",
"Sahaflar, il mercato dei libri":"Il mercato dei libri usati, in un cortile ombreggiato tra la moschea di Beyazıt e il Gran Bazar. Stampe ottomane, miniature, mappe e calligrafie. È a cinque minuti dall'hotel.",
"Süleymaniye al tramonto":"La moschea più grande di Istanbul, costruita tra il 1550 e il 1557 da Sinan per Solimano il Magnifico. Nel giardino ci sono le tombe di Solimano e della moglie Hürrem, e Sinan riposa in un piccolo mausoleo all'angolo del complesso. Dalla terrazza sul retro si vede tutto il Corno d'Oro.",
"Acquedotto di Valente":"Un acquedotto romano completato nel IV secolo sotto l'imperatore Valente. Oggi gli archi scavalcano un viale trafficato e si guardano da fuori, gratis. A pochi passi c'è Vefa Bozacısı, dove si beve la boza dal 1876.",
"Hierapolis e travertini":"Le terrazze bianche di Pamukkale sono calcare depositato da sorgenti termali che escono a circa 35 °C. Sopra c'è Hierapolis, città greco-romana con un grande teatro, il Plutonium, cioè la «Porta degli Inferi» ritrovata nel 2013 da una missione italiana, e una necropoli con oltre mille tombe. Patrimonio UNESCO dal 1988. Sulle terrazze si cammina solo scalzi.",
"Piscina antica":"Una vasca termale dove l'acqua resta intorno ai 35 °C tutto l'anno. Sul fondo giacciono colonne di marmo crollate con un terremoto. Si dice che ci abbia fatto il bagno Cleopatra, ma è una leggenda. Il bagno ha un biglietto a parte; il bordo e il bar sono gratis.",
"Tramonto sulle terrazze":"Verso sera il calcare bianco si colora di rosa e arancio. Fermatevi sul bordo delle vasche prima di ripartire per l'aeroporto.",
"Traghetto per Üsküdar":"Il traghetto pubblico attraversa il Bosforo in circa 15 minuti, con la vista sul Topkapı e sulla Torre di Leandro. Si paga con l'Istanbulkart. Üsküdar è il lato asiatico più tradizionale, con moschee ottomane e il lungomare.",
"Kuzguncuk":"Un piccolo quartiere sul Bosforo con case di legno colorate, dove una chiesa, una moschea e una sinagoga stanno a pochi metri l'una dall'altra. È la Istanbul dei local: caffè, panetterie e alberi di fico. Si raggiunge in pochi minuti da Üsküdar.",
"Tramonto da Salacak":"Il lungomare di Salacak, a Üsküdar, è il posto preferito dei local per il tramonto: davanti la Torre di Leandro, sullo sfondo la città vecchia con cupole e minareti. Ci si siede sugli scalini con un tè.",
"Torre di Leandro":"Una piccola torre su un isolotto all'ingresso del Bosforo, legata a molte leggende, restaurata e riaperta nel 2023. Compare nel film di James Bond «Il mondo non basta». Al tramonto è perfetta anche da fuori; per entrare servono il biglietto e una barca da Salacak.",
"Topkapı con l'Harem":"Il palazzo dei sultani ottomani per quasi quattro secoli. Cortili, padiglioni con piastrelle di Iznik, cucine enormi e il Tesoro, con il diamante del Fabbricante di Cucchiai di circa 86 carati. L'Harem, dove vivevano la famiglia del sultano e le concubine, è nel biglietto combinato. Chiuso il martedì.",
"Parco di Gülhane":"L'antico giardino del Topkapı, oggi parco pubblico. Qui nel 1839 fu letto l'Editto di Gülhane che avviò le riforme ottomane, e in fondo al parco c'è la Colonna dei Goti, di epoca romana. Ad aprile si riempie di tulipani; a marzo è verde e tranquillo.",
"Bazar delle Spezie":"Costruito negli anni 1660 insieme alla Moschea Nuova, si chiama anche Bazar Egiziano perché era finanziato con le entrate dall'Egitto. Spezie, frutta secca, lokum, tè e caffè, con assaggi a ogni banco. Aperto anche la domenica.",
"Moschea di Rüstem Paşa":"Una moschea di Sinan costruita su una piattaforma sopra le botteghe del mercato, per Rüstem Paşa, gran visir e genero di Solimano. Le pareti sono coperte di piastrelle di Iznik più che in qualsiasi altra moschea della città. Si sale da una scala stretta tra i negozi: molti non la trovano.",
"Traghetto per Kadıköy":"Dal molo di Eminönü il traghetto arriva a Kadıköy, sul lato asiatico, in circa 20 minuti. È il modo più economico per vedere il Bosforo. I gabbiani seguono la nave: i local comprano il simit per loro.",
"Mercato di Kadıköy":"Kadıköy è l'antica Calcedonia, che Erodoto chiamò «città dei ciechi» perché i fondatori non videro la sponda migliore, dove poi nacque Bisanzio. Il suo mercato è il più vivace della città: banchi di pesce, sottaceti, formaggi, cozze ripiene e pasticcerie.",
"Tramonto sul lungomare di Moda":"Una penisola residenziale a 15 minuti a piedi da Kadıköy, con un lungomare dove la sera si passeggia, ci si siede sugli scogli e si guarda il tramonto sul mare.",
"Palazzo Dolmabahçe":"Il palazzo che i sultani scelsero nell'Ottocento al posto del Topkapı, in stile europeo, sul Bosforo. Sale piene di cristalli e oro, con un lampadario di circa quattro tonnellate e mezzo. Qui morì Atatürk il 10 novembre 1938 alle 9:05: gli orologi del palazzo sono fermi a quell'ora. Chiuso il lunedì.",
"Moschea di Ortaköy":"Una piccola moschea del 1854–56, firmata dalla famiglia di architetti Balyan, sulla riva del Bosforo proprio sotto il ponte che unisce Europa e Asia. È una delle foto simbolo di Istanbul. Intorno ci sono i banchi del kumpir.",
"Crociera sul Bosforo":"Il modo più semplice per vedere ville ottomane, palazzi e fortezze sulle due rive. Le barche di Turyol partono da Eminönü circa ogni ora per un giro di circa 90 minuti. Si passa davanti alla fortezza di Rumeli Hisarı, costruita in circa quattro mesi nel 1452.",
"Scalinata Camondo":"Una scalinata curva fatta costruire intorno al 1870–80 dal banchiere Abraham Salomon Camondo, tra la via delle banche e la salita verso Galata. Le curve servivano a non far scivolare i passanti.",
"Torre di Galata":"Torre genovese del 1348 sopra il quartiere che fu colonia di Genova. Secondo la leggenda, nel Seicento Hezarfen Ahmed Çelebi si lanciò da qui con delle ali e planò fino a Üsküdar. Da fuori è bellissima; salire costa 30 € e la coda è lunga.",
"Çukurcuma":"Un quartiere in salita di Beyoğlu con più di cento antiquari e negozi vintage: tessuti ottomani, lampade, vetri. Qui c'è anche il Museo dell'Innocenza dello scrittore Orhan Pamuk.",
"Hammam Kılıç Ali Paşa":"Un hammam progettato da Sinan nel 1580 a Tophane, restaurato e riaperto nel 2012. Sotto la cupola ci si sdraia sul marmo caldo, poi arrivano lo scrub con il guanto e la schiuma. I turni sono separati per uomini e donne: per una coppia va chiesta una sezione privata alla prenotazione.",
"Balat e Fener":"Due quartieri storici sul Corno d'Oro, un tempo delle comunità greca ed ebraica. Case colorate, scalinate ripide, caffè e botteghe. In cima domina il «castello rosso», il liceo greco-ortodosso del Fanar, e poco lontano c'è la sede del Patriarcato ecumenico.",
"Chiesa bulgara di Santo Stefano":"La chiesa della comunità bulgara, consacrata nel 1898, è tutta in ghisa: i pezzi furono fusi a Vienna e arrivarono lungo il Danubio. Restaurata e riaperta nel 2018, è gratis e si visita in dieci minuti.",
"Chora (Kariye)":"Una chiesa bizantina con alcuni dei mosaici e affreschi più belli al mondo, realizzati tra il 1315 e il 1321 per Teodoro Metochite, che compare inginocchiato a offrire la chiesa a Cristo. Dal 2024 è una moschea con un percorso turistico a pagamento. Chiusa il venerdì.",
"Fethiye (Pammakaristos)":"L'antica chiesa della Pammakaristos, con mosaici bizantini del XIV secolo in una cappella laterale: una versione intima della Chora, quasi sempre vuota. A dieci minuti a piedi da Fener. Orari da controllare sul posto.",
"Funivia di Pierre Loti":"Una collina sopra il Corno d'Oro, raggiungibile con la funivia da Eyüp. Prende il nome dallo scrittore francese Pierre Loti, che frequentava il caffè in cima. Si beve un tè guardando il tramonto.",
"Ultimi acquisti al Bazar delle Spezie":"La domenica il Gran Bazar è chiuso, ma il Bazar delle Spezie è aperto. Qui si comprano caffè macinato al momento da Kurukahveci Mehmet Efendi e lokum da Hacı Bekir, a pochi passi."

     (opts.check?'<div class="sacts"><button type="button" class="btn sdone">'+(opts.check.isDone(i)?'Fatto ✓':'Segna fatto')+'</button><button type="button" class="btn quiet slater">'+(i<items.length-1?'Dopo':'Chiudi')+'</button></div>':'<p class="stap">Tocca a destra per andare avanti</p>')+

var RENDER={"duel":renderDuel,"r-hotel":renderHotelResult,"r-giorni":renderGiorni,"r-tavola":renderTavola,"piatti":renderPiatti,"r-botteghe":renderBotteghe,"fine":renderFine,"consigli":renderConsigli,"partire":renderPartire,"appendice":renderAppendice};

/* =================== NAVIGAZIONE =================== */
var curId="splash";
function updateBar(){
  var F=FLOW(),i=F.findIndex(function(s){return s.id===curId}),st=F[i];
  $("#bar").hidden=curId==="splash"||curId==="grazie";
  var ch=st.ch||(st.q?Q[st.id].ch:"");$("#barLab").textContent=CH[ch]||"";
  if(st.q){var list=F.filter(function(s){return s.q&&Q[s.id].ch===Q[st.id].ch});$("#barCnt").textContent=(list.findIndex(function(s){return s.id===st.id})+1)+" di "+list.length}else $("#barCnt").textContent="";
  $("#barProg").style.width=(i/(F.length-1)*100)+"%";
}
function animIn(p){
  if(!G)return;
  gsap.fromTo(p,{x:40,opacity:0},{x:0,opacity:1,duration:.45,ease:"power3.out"});
  var t=$(".ttl",p);
  if(t&&window.SplitText&&!t._split&&p.dataset.id!=="splash"){t._split=new SplitText(t,{type:"words",wordsClass:"w"})}
  if(t&&t._split)gsap.from(t._split.words,{yPercent:60,rotate:-6,opacity:0,duration:.6,ease:"back.out(2.2)",stagger:.06,delay:.08});
  var items=$$(".opt,.chip",p);if(items.length)gsap.from(items,{y:24,opacity:0,duration:.45,ease:"back.out(2)",stagger:.07,delay:.25});
}
function goTo(id,push){
  var p=pageOf(id);if(!p)return;
  if(RENDER[id])RENDER[id]($("[data-body]",p));
  $$(".page",app).forEach(function(x){x.hidden=x!==p});
  curId=id;updateBar();window.scrollTo(0,0);
  if(push!==false){try{history.pushState({id:id},"")}catch(e){}}
  animIn(p);
  if(id==="r-hotel"||id==="fine"||id==="grazie")setTimeout(function(){boom(id==="grazie"?220:id==="fine"?180:130);if(id==="grazie")setTimeout(function(){boom(160,.4)},700)},350);
  var f=$(".ttl",p);if(f){f.setAttribute("tabindex","-1");try{f.focus({preventScroll:true})}catch(e){}}
}
function next(){var F=FLOW(),i=F.findIndex(function(s){return s.id===curId});if(i<F.length-1)goTo(F[i+1].id)}
window.addEventListener("popstate",function(e){goTo(e.state&&e.state.id?e.state.id:"splash",false)});
$("#back").addEventListener("click",function(){history.back()});

app.addEventListener("click",function(e){
  var inf=e.target.closest("[data-info]");if(inf){openSheet(inf.dataset.info,CH[FLOW().filter(function(s){return s.id===curId})[0].ch]||"");return}
  var n=e.target.closest("[data-next]");if(n){if(curId==="splash")boom(70,.85);next();return}
  var o=e.target.closest(".opt");
  if(o){A[o.dataset.q]=o.dataset.v;save("answers",A);syncAnswers();if(G)gsap.fromTo(o,{scale:.94},{scale:1,duration:.35,ease:"back.out(3)"});setTimeout(next,REDUCE?0:380);return}
  var c=e.target.closest("[data-multi] .chip");
  if(c){var k=c.parentNode.dataset.multi,arr=A[k]||[],v=c.dataset.v,p=arr.indexOf(v);if(p>-1)arr.splice(p,1);else arr.push(v);A[k]=arr;save("answers",A);syncAnswers();if(G)gsap.fromTo(c,{scale:.9},{scale:1,duration:.3,ease:"back.out(3)"})}
});

$("#toGuide").onclick=function(){goTo("r-giorni")};
$("#toStart").onclick=function(){A={};save("answers",A);save("hotel",null);["pick","dishes","shops","swap"].forEach(function(k){save(k,null)});curDay=0;syncAnswers();goTo("splash")};
syncAnswers();
try{history.replaceState({id:"splash"},"")}catch(e){}
goTo("splash",false);
if(G&&window.SplitText){var sp=new SplitText(".splash h1",{type:"chars",charsClass:"ch"});gsap.from(sp.chars,{yPercent:70,rotate:-14,scale:.6,duration:.9,ease:"back.out(2.4)",stagger:.06})}
else{var t0=$(".splash h1");t0.innerHTML=t0.textContent.split("").map(function(c){return '<span class="ch">'+c+'</span>'}).join("")}
})();
